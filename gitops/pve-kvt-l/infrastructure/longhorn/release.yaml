---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: longhorn, namespace: flux-system}
spec:
  interval: 30m
  timeout: 15m
  targetNamespace: longhorn-system
  chart:
    spec:
      chart: longhorn
      version: "1.12.0"
      sourceRef: {kind: HelmRepository, name: longhorn, namespace: flux-system}
  install: {createNamespace: true}
  upgrade:
    remediation: {retries: 3}  # автооткат при неудачном апгрейде
  values:  # ровно твой values.yaml, но без ключа-обёртки
    defaultSettings:
      defaultReplicaCount: 2
      defaultDataPath: /var/lib/longhorn
    persistence:
      defaultClassReplicaCount: 2
