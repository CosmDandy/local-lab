# Reverse proxy to the IBM IMM of pve-local-l-01.
#
# The IMM firmware (1.55, ~2011) serves a web UI that a modern browser cannot use directly:
# its HTTPS offers only TLS 1.0 with SHA-1/3DES, and its HTTP responses hardcode the IMM's
# own address in redirects and set Secure cookies. Everything below exists to paper over
# that, not out of preference.

events {}

http {
    server {
        listen 8070;
        server_name _;

        location / {
            proxy_pass http://10.0.1.100;
            proxy_http_version 1.1;

            # The IMM validates Host and rejects anything but its own address.
            proxy_set_header Host 10.0.1.100;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;

            # We terminate as plain HTTP, so Secure cookies would be dropped by the browser
            # and login would silently fail.
            proxy_cookie_flags ~ nosecure;

            # The IMM emits absolute redirects to its own address; without rewriting them
            # the browser leaves the proxy and lands on an unreachable URL.
            proxy_redirect https://10.0.1.100/ http://$host:8070/;
            proxy_redirect http://10.0.1.100/  http://$host:8070/;

            # The IMM streams status updates; buffering stalls them.
            proxy_buffering off;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }
    }
}
